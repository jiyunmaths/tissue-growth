[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tissue-growth"
version = "0.1.0"
description = "Growing-domain pattern formation with FEniCSx and a browser dashboard"
authors = [{name = "jiyunmaths", email = "jiyunmathbham@gmail.com"}]
license = {text = "MIT"}
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "psutil>=5.9", "pyvista>=0.46,<0.50", "trame>=3.10,<4", "trame-vtk>=2.9,<3", "trame-vuetify>=3,<4"]

[project.urls]
Homepage = "https://github.com/jiyunmaths/tissue-growth"
Repository = "https://github.com/jiyunmaths/tissue-growth"
Issues = "https://github.com/jiyunmaths/tissue-growth/issues"

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.49"]

[project.scripts]
tissue-growth = "tissue_growth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fenics: requires a FEniCSx installation", "browser: requires Chromium"]
